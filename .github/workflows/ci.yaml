name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spread:
    name: Spread tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install LXD 6.x
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
        with:
          channel: 6/stable

      - name: Install sdkcraft
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 10
          command: sudo snap install sdkcraft --classic

      # sdkcraft test installs Workshop inside the spread test environment
      # by copying a local snap, rather than fetching from the store — the
      # public Workshop snap is treated as private until it graduates from
      # 0.x. Download it once on the runner so sdkcraft can find it.
      - name: Stage Workshop snap for sdkcraft test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 5
          command: snap download workshop --target-directory=tests

      # sdkcraft test packs the SDK for the current architecture, copies it
      # into the test environment via sdkcraft try, installs Workshop inside
      # the test environment, and runs the spread suite under tests/.
      - name: Run spread tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 150
          command: sdkcraft --verbose test
