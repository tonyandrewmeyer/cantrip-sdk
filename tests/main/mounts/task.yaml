summary: All four persistent-state mount targets are present and writable

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # The SDK declares four mount plugs covering Cantrip config/data, Juju
  # client state, and gh auth.  Each target must exist, be owned by the
  # workshop user, and survive a write/read round-trip — that's the property
  # the SDK is promising to consumers, independent of any product on top.
  for path in \
      /home/workshop/.config/cantrip \
      /home/workshop/.local/share/cantrip \
      /home/workshop/.local/share/juju \
      /home/workshop/.config/gh ; do
    workshop exec -- bash -lc "test -d '$path'"
    workshop exec -- bash -lc "stat -c '%U' '$path'" | MATCH "^workshop$"
    workshop exec -- bash -lc "touch '$path/.spread-probe' && rm '$path/.spread-probe'"
  done

debug: |
  workshop exec -- ls -la /home/workshop/.config /home/workshop/.local/share || true
