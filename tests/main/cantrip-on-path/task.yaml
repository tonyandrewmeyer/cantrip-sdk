summary: cantrip is on $PATH inside the workshop

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # `workshop exec` runs as the `workshop` user with a login shell, which
  # picks up /etc/profile.d/cantrip.sh from setup-base. `uv tool install`
  # places the binary under $HOME/.local/bin (UV_TOOL_BIN_DIR).
  workshop exec -- bash -lc 'command -v cantrip' | MATCH "/cantrip$"

debug: |
  workshop exec -- bash -lc 'echo PATH=$PATH' || true
  workshop exec -- bash -lc 'ls -l /etc/profile.d/cantrip.sh' || true
  workshop exec -- bash -lc 'ls -l $HOME/.local/bin' || true
